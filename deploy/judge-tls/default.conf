include /etc/nginx/shared/api-upstream.conf;

server {
    listen 443 ssl;
    server_name 10.10.10.110;
    ssl_certificate /etc/nginx/judge-tls/server.crt;
    ssl_certificate_key /etc/nginx/judge-tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    include /etc/nginx/shared/judge-access.inc;

    location = /api/health {
        proxy_pass http://api_backend;
    }
    # Only the dedicated Editor VM may call the signed account/publishing API.
    location ^~ /api/editor/ {
        allow 10.10.10.118;
        deny all;
        client_max_body_size 768m;
        proxy_request_buffering off;
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
    location /minio/ {
        allow 10.10.10.111;
        allow 10.10.10.112;
        allow 10.10.10.113;
        allow 10.10.10.114;
        allow 10.10.10.115;
        allow 10.10.10.116;
        allow 10.10.10.117;
        deny all;
        proxy_pass http://minio:9000/;
        proxy_set_header Host minio:9000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
    }
    location / { return 404; }
}
